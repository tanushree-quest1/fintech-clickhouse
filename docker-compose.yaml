services:
  clickstack:
    image: clickhouse/clickstack-local:latest
    container_name: bank-control-tower-clickstack
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: bank-control-tower-ch
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
      - ./init:/docker-entrypoint-initdb.d
    environment:
      - CLICKHOUSE_DB=bank_demo
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=demo_pass
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 8G

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bank-control-tower-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bank-control-tower-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1