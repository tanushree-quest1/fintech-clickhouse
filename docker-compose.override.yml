services:
  librechat:
    image: librechat/librechat:latest
    container_name: bank-control-tower-librechat
    ports:
      - "3080:3080"
    volumes:
      - ./LibreChat/.env:/app/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGO_URI=mongodb://librechat-mongo:27017/LibreChat
      - CONFIG_BYPASS_VALIDATION=true
      - JWT_SECRET=demo-jwt-secret-very-long-random-string-for-production-use-please-change-in-production-environment-2024
      - REFRESH_TOKEN_SECRET=demo-refresh-token-secret-very-long-random-string-for-production-use-please-change-in-production-environment-2024
    depends_on:
      - librechat-mongo
      - mcp-clickhouse

  librechat-mongo:
    image: mongo:latest
    container_name: bank-control-tower-librechat-mongo
    ports:
      - "27017:27017"
    volumes:
      - librechat-mongo-data:/data/db

volumes:
  librechat-mongo-data: